<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nuevo paciente</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">

    <h2>Nuevo paciente</h2>

    <form action="/pacientes/guardar" method="post" th:object="${paciente}">

        <div class="mb-3">
            <label class="form-label">Nombres</label>
            <input type="text" class="form-control" th:field="*{nombres}">
        </div>

        <div class="mb-3">
            <label class="form-label">Apellidos</label>
            <input type="text" class="form-control" th:field="*{apellidos}">
        </div>

        <div class="mb-3">
            <label class="form-label">DNI</label>
            <input type="text" class="form-control" th:field="*{dni}">
        </div>

        <button type="submit" class="btn btn-success">Guardar</button>
        <a href="/pacientes" class="btn btn-secondary">Cancelar</a>

    </form>

</div>
</body>
</html>
