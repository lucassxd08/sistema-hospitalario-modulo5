<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nueva historia clinica</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">

    <h2>Nueva historia clinica</h2>
    <p>El numero de historia se genera automaticamente al elegir el paciente.</p>

    <form action="/historias/guardar" method="post">

        <div class="mb-3">
            <label class="form-label">Paciente</label>
            <select class="form-select" name="pacienteId">
                <option th:each="p : ${pacientes}"
                        th:value="${p.id}"
                        th:text="${p.nombres + ' ' + p.apellidos + ' - DNI ' + p.dni}">
                </option>
            </select>
        </div>

        <button type="submit" class="btn btn-success">Generar historia</button>
        <a href="/historias" class="btn btn-secondary">Cancelar</a>

    </form>

</div>
</body>
</html>
