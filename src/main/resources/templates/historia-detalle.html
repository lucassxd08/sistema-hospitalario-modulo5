<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Historia clinica</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">

    <h2>Historia clinica</h2>

    <a href="/historias" class="btn btn-outline-secondary mb-3">Volver</a>

    <div class="card mb-4">
        <div class="card-body">
            <h5 class="card-title" th:text="${historia.numeroHistoria}"></h5>
            <p class="card-text">
                Paciente: <strong th:text="${historia.paciente.nombres + ' ' + historia.paciente.apellidos}"></strong><br>
                DNI: <span th:text="${historia.paciente.dni}"></span><br>
                Fecha de apertura: <span th:text="${historia.fechaApertura}"></span><br>
                Estado: <span th:text="${historia.estado}"></span>
            </p>
        </div>
    </div>

    <h4>Antecedentes personales</h4>
    <table class="table table-bordered table-striped">
        <thead class="table-dark">
        <tr>
            <th>Categoria</th>
            <th>Descripcion</th>
            <th>Fecha de registro</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="a : ${antecedentes}">
            <td th:text="${a.categoria}"></td>
            <td th:text="${a.descripcion}"></td>
            <td th:text="${a.fechaRegistro}"></td>
        </tr>
        </tbody>
    </table>

    <h4>Antecedentes familiares</h4>
    <table class="table table-bordered table-striped">
        <thead class="table-dark">
        <tr>
            <th>Enfermedad</th>
            <th>Parentesco</th>
            <th>Fecha de registro</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="f : ${familiares}">
            <td th:text="${f.enfermedad}"></td>
            <td th:text="${f.parentesco}"></td>
            <td th:text="${f.fechaRegistro}"></td>
        </tr>
        </tbody>
    </table>

    <h4>Alergias</h4>
    <table class="table table-bordered table-striped">
        <thead class="table-dark">
        <tr>
            <th>Alergia</th>
            <th>Tipo</th>
            <th>Reaccion</th>
            <th>Fecha de registro</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="al : ${alergias}">
            <td th:text="${al.nombre}"></td>
            <td th:text="${al.tipo}"></td>
            <td th:text="${al.reaccion}"></td>
            <td th:text="${al.fechaRegistro}"></td>
        </tr>
        </tbody>
    </table>

</div>
</body>
</html>
