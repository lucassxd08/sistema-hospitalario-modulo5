<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Antecedentes personales</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">

    <h2>Antecedentes personales</h2>
    <p>RF-HC-05: registro de antecedentes personales del paciente.</p>

    <a href="/antecedentes/nuevo" class="btn btn-primary mb-3">Nuevo antecedente</a>

    <table class="table table-bordered table-striped">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Historia clinica</th>
            <th>Categoria</th>
            <th>Descripcion</th>
            <th>Fecha de registro</th>
            <th>Observaciones</th>
            <th>Accion</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="a : ${antecedentes}">
            <td th:text="${a.id}"></td>
            <td th:text="${a.historiaClinicaId}"></td>
            <td th:text="${a.categoria}"></td>
            <td th:text="${a.descripcion}"></td>
            <td th:text="${a.fechaRegistro}"></td>
            <td th:text="${a.observaciones}"></td>
            <td>
                <a th:href="@{/antecedentes/eliminar/{id}(id=${a.id})}"
                   class="btn btn-danger btn-sm">Eliminar</a>
            </td>
        </tr>
        </tbody>
    </table>

</div>
</body>
</html>
