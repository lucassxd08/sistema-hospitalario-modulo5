<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pacientes</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">

    <h2>Pacientes</h2>
    <p>RF-HC-03: datos basicos del paciente.</p>

    <a href="/panel" class="btn btn-outline-secondary mb-3">Inicio</a>
    <a href="/pacientes/nuevo" class="btn btn-primary mb-3">Nuevo paciente</a>
    <a href="/historias/nueva" class="btn btn-secondary mb-3">Generar historia clinica</a>

    <table class="table table-bordered table-striped">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Nombres</th>
            <th>Apellidos</th>
            <th>DNI</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p : ${pacientes}">
            <td th:text="${p.id}"></td>
            <td th:text="${p.nombres}"></td>
            <td th:text="${p.apellidos}"></td>
            <td th:text="${p.dni}"></td>
        </tr>
        </tbody>
    </table>

</div>
</body>
</html>
