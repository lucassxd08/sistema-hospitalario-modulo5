<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Historias clinicas</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">

    <h2>Historias clinicas</h2>
    <p>RF-HC-01 y RF-HC-02: numero unico de historia clinica y consulta de la historia.</p>

    <a href="/panel" class="btn btn-outline-secondary mb-3">Inicio</a>
    <a href="/historias/nueva" class="btn btn-primary mb-3">Nueva historia clinica</a>

    <table class="table table-bordered table-striped">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>N. Historia</th>
            <th>Paciente</th>
            <th>DNI</th>
            <th>Fecha de apertura</th>
            <th>Estado</th>
            <th>Accion</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="h : ${historias}">
            <td th:text="${h.id}"></td>
            <td th:text="${h.numeroHistoria}"></td>
            <td th:text="${h.paciente.nombres + ' ' + h.paciente.apellidos}"></td>
            <td th:text="${h.paciente.dni}"></td>
            <td th:text="${h.fechaApertura}"></td>
            <td th:text="${h.estado}"></td>
            <td>
                <a th:href="@{/historias/{id}(id=${h.id})}" class="btn btn-info btn-sm">Ver</a>
            </td>
        </tr>
        </tbody>
    </table>

</div>
</body>
</html>
